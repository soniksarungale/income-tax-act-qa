services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxqa}
      POSTGRES_DB: taxqa
    # Small footprint: the whole index is a few thousand rows, and the host it was built on has 2 GB of RAM.
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=20
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxqa -d taxqa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
