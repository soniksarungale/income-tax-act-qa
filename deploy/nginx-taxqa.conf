# nginx site for taxqa.soniksarungale.com: everything is proxied to the app on 127.0.0.1:4700.
#
# Install (adds a new site only; other sites are not touched):
#   sudo cp deploy/nginx-taxqa.conf /etc/nginx/sites-available/taxqa
#   sudo ln -sf /etc/nginx/sites-available/taxqa /etc/nginx/sites-enabled/taxqa
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS:  sudo certbot --nginx -d taxqa.soniksarungale.com

server {
    listen 80;
    listen [::]:80;
    server_name taxqa.soniksarungale.com;

    client_max_body_size 16k;   # questions are at most 1000 characters

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, not appended, so a client cannot choose the address the rate limit sees.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A question can wait behind others for the single model process (see taxqa/llm.py).
        proxy_read_timeout 300s;
    }
}
