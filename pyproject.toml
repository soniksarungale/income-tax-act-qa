[project]
name = "taxqa"
version = "0.1.0"
description = "Question answering over the Income-tax Act, 1961 with section-level citations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.25",
    "fastembed>=0.5",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taxqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
